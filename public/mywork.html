<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pop OS — My Work</title>
  <link rel="icon" type="image/png" href="/lps-logo.png" />

  <!-- Paint body background immediately to prevent a flash while Tailwind loads. -->
  <script>
    try {
      const mode = localStorage.getItem('pop-os-mode') || 'dark';
      const custom = JSON.parse(localStorage.getItem('pop-os-theme-' + mode) || localStorage.getItem('pop-os-theme') || 'null');
      const fallback = mode === 'light' ? '#f5f2ec' : '#111009';
      const bg = (custom && custom.bg) ? custom.bg : fallback;
      document.write('<style>body{background-color:' + bg + '}</style>');
    } catch (e) {}
  </script>

  <!-- CDN must load first so it can set up its own global object. -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- After CDN is ready, resolve and apply the active palette. -->
  <script>
    (function () {
      const DARK  = { bg:'#111009', panel:'#191814', panel2:'#201e19', line:'#2c2920', ink:'#e4e0d4', muted:'#857f73', accent:'#d4a23a', warm:'#c05535' };
      const LIGHT = { bg:'#f5f2ec', panel:'#fdfcf9', panel2:'#ece8e0', line:'#d8d2c8', ink:'#1a1814',  muted:'#7a7468', accent:'#b8871e', warm:'#b04525' };
      const mode   = localStorage.getItem('pop-os-mode') || 'dark';
      const base   = mode === 'light' ? LIGHT : DARK;
      // Fall back to the old single-key format so previously saved themes aren't lost.
      const custom = JSON.parse(localStorage.getItem('pop-os-theme-' + mode) || localStorage.getItem('pop-os-theme') || 'null');
      const theme  = custom || base;
      window._mode  = mode;
      window._theme = theme;
      window._DARK  = DARK;
      window._LIGHT = LIGHT;
      tailwind.config = { theme: { extend: { colors: theme } } };
    })();
  </script>

  <style type="text/tailwindcss">
    @layer components {
      .form-input {
        @apply w-full bg-panel2 border border-line text-ink placeholder-muted/60
               px-3 py-2 rounded-lg text-sm focus:outline-none focus:border-accent/70
               transition-colors duration-150;
      }
      .form-label {
        @apply block text-xs text-muted font-medium mb-1.5 mt-3;
      }
      .btn-del {
        @apply bg-transparent border border-line text-muted px-2.5 py-1 rounded-md
               text-xs font-medium hover:border-warm/60 hover:text-warm
               transition-colors duration-150 cursor-pointer;
      }
      .btn-edit {
        @apply bg-transparent border border-line text-muted px-2.5 py-1 rounded-md
               text-xs font-medium hover:border-accent/60 hover:text-accent
               transition-colors duration-150 cursor-pointer;
      }
      .badge {
        @apply inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold;
      }
      .nav-sub-item {
        @apply block w-full text-left px-4 py-2 text-xs text-muted hover:text-ink hover:bg-panel2
               transition-colors duration-150 cursor-pointer;
      }
      .nav-sub-item.active {
        @apply text-ink font-semibold;
      }
    }
  </style>

  <!-- Shared shell: utilities, theme, auth (incl. the not-logged-in redirect),
       nav, user menu. See shared.js's file header for the full contract. -->
  <script src="/js/shared.js"></script>
</head>
<body class="bg-bg min-h-screen text-ink antialiased">

  <!-- Header — same nav on every page, built by shared.js's renderHeader(). -->
  <script>document.write(renderHeader('mywork'));</script>

  <!-- ── SETTINGS OVERLAY ────────────────────────────────────── -->
  <div id="settings-overlay"
    class="hidden fixed inset-0 bg-bg/60 backdrop-blur-sm z-[100]"
    onclick="closeSettings()"></div>

  <!-- ── SETTINGS DRAWER ────────────────────────────────────── -->
  <div id="settings-panel"
    class="hidden fixed right-0 top-0 h-full w-80 bg-panel border-l border-line z-[101] overflow-y-auto flex flex-col">

    <div class="flex items-center justify-between px-5 py-4 border-b border-line shrink-0">
      <h2 class="text-sm font-semibold text-ink">Theme</h2>
      <button onclick="closeSettings()"
        class="w-7 h-7 flex items-center justify-center rounded-lg text-muted hover:text-ink hover:bg-panel2 transition-colors cursor-pointer text-lg leading-none">
        ×
      </button>
    </div>

    <div class="p-5 space-y-6 flex-1">

      <!-- Day / Night mode -->
      <div>
        <p class="text-[11px] font-semibold uppercase tracking-widest text-muted mb-3">Mode</p>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="switchMode('light')" id="mode-day-btn"
            class="flex items-center justify-center gap-2 border rounded-lg px-3 py-2.5
                   hover:border-accent/50 transition-colors cursor-pointer text-xs font-semibold">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
            </svg>
            Day
          </button>
          <button onclick="switchMode('dark')" id="mode-night-btn"
            class="flex items-center justify-center gap-2 border rounded-lg px-3 py-2.5
                   hover:border-accent/50 transition-colors cursor-pointer text-xs font-semibold">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
            </svg>
            Night
          </button>
        </div>
      </div>

      <!-- Presets -->
      <div>
        <p class="text-[11px] font-semibold uppercase tracking-widest text-muted mb-3">Presets</p>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="applyPreset('Warm Dark')" data-preset="Warm Dark"
            class="preset-btn flex items-center gap-2 bg-panel2 border border-line rounded-lg px-3 py-2.5
                   hover:border-accent/50 transition-colors cursor-pointer text-left">
            <span class="w-4 h-4 rounded-full bg-[#d4a23a] shrink-0"></span>
            <span class="text-xs font-medium text-ink">Warm Dark</span>
          </button>
          <button onclick="applyPreset('Cool Dark')" data-preset="Cool Dark"
            class="preset-btn flex items-center gap-2 bg-panel2 border border-line rounded-lg px-3 py-2.5
                   hover:border-accent/50 transition-colors cursor-pointer text-left">
            <span class="w-4 h-4 rounded-full bg-[#5b9cf6] shrink-0"></span>
            <span class="text-xs font-medium text-ink">Cool Dark</span>
          </button>
          <button onclick="applyPreset('Midnight')" data-preset="Midnight"
            class="preset-btn flex items-center gap-2 bg-panel2 border border-line rounded-lg px-3 py-2.5
                   hover:border-accent/50 transition-colors cursor-pointer text-left">
            <span class="w-4 h-4 rounded-full bg-[#7c6fcd] shrink-0"></span>
            <span class="text-xs font-medium text-ink">Midnight</span>
          </button>
          <button onclick="applyPreset('Forest')" data-preset="Forest"
            class="preset-btn flex items-center gap-2 bg-panel2 border border-line rounded-lg px-3 py-2.5
                   hover:border-accent/50 transition-colors cursor-pointer text-left">
            <span class="w-4 h-4 rounded-full bg-[#5aab66] shrink-0"></span>
            <span class="text-xs font-medium text-ink">Forest</span>
          </button>
        </div>
      </div>

      <!-- Color pickers -->
      <div>
        <p class="text-[11px] font-semibold uppercase tracking-widest text-muted mb-3">Custom colors</p>
        <div class="space-y-1">
          <!-- Each row: label + hex text + color swatch -->
          <div id="rows-colors"></div>
        </div>
      </div>

    </div>

    <!-- Footer actions -->
    <div class="px-5 py-4 border-t border-line shrink-0 space-y-2">
      <button onclick="saveAndApply()"
        class="w-full bg-accent text-bg font-semibold py-2.5 rounded-lg text-sm
               hover:brightness-110 transition-all duration-150 cursor-pointer">
        Save &amp; apply
      </button>
      <button onclick="resetTheme()"
        class="w-full bg-transparent border border-line text-muted font-medium py-2 rounded-lg text-sm
               hover:border-warm/60 hover:text-warm transition-colors duration-150 cursor-pointer">
        Reset to defaults
      </button>
    </div>
  </div>

  <!-- ════════════════════════════════════════════════════
       MY WORK — personal dashboard for the logged-in user
  ════════════════════════════════════════════════════ -->
  <div class="max-w-7xl mx-auto px-5 py-6">

    <!-- Stats strip -->
    <div class="flex items-center justify-between gap-4 px-5 py-3 mb-5 bg-panel border border-line rounded-xl">
      <div id="mw-stats" class="text-sm text-muted">Loading…</div>
      <div id="mw-profile-btn" class="shrink-0"></div>
    </div>

    <!-- No person link warning (hidden by default) -->
    <div id="mw-no-link"
      class="hidden mb-5 px-5 py-3 bg-yellow-500/10 border border-yellow-500/30 rounded-xl text-xs text-yellow-400">
      Your account is not linked to a staff record. Ask an admin to link your User to a Person — then your capacity, assigned assets, and project context will appear here.
    </div>

    <!-- Main content (rendered by mywork.js) -->
    <div id="mw-content"></div>

  </div>

  <!-- ── User Manager modal (admin only) ──────────────────────── -->
  <div id="user-mgr-overlay" class="hidden fixed inset-0 z-50 flex items-center justify-center">
    <div class="absolute inset-0 bg-bg/80 backdrop-blur-sm" onclick="closeUserManager()"></div>
    <div class="relative bg-panel border border-line rounded-2xl p-6 w-full max-w-lg mx-4 z-10">
      <div class="flex items-center justify-between mb-5">
        <h2 class="text-sm font-semibold text-ink">Manage Users</h2>
        <button onclick="closeUserManager()" class="text-muted hover:text-ink transition-colors cursor-pointer text-lg leading-none">×</button>
      </div>

      <div class="overflow-x-auto mb-5">
        <table class="w-full text-sm">
          <thead>
            <tr class="border-b border-line">
              <th class="text-left pb-2 px-3 text-[11px] font-semibold uppercase tracking-wider text-muted">Name</th>
              <th class="text-left pb-2 px-3 text-[11px] font-semibold uppercase tracking-wider text-muted">Email</th>
              <th class="text-left pb-2 px-3 text-[11px] font-semibold uppercase tracking-wider text-muted">Role</th>
              <th class="pb-2 px-3 text-[11px] font-semibold uppercase tracking-wider text-muted text-center">Active</th>
              <th class="pb-2 px-3"></th>
            </tr>
          </thead>
          <tbody id="user-list"></tbody>
        </table>
      </div>

      <div class="border-t border-line pt-4">
        <p class="text-[11px] font-semibold uppercase tracking-widest text-muted mb-3">Add user</p>
        <!-- Real <form> + autocomplete="new-password" scope this email+password
             pair away from the rest of the page — without it, browsers detect
             a login-shaped field pair here and offer to autofill unrelated
             text inputs elsewhere on the page (e.g. a search box) with a
             saved email. -->
        <form autocomplete="off" onsubmit="return false">
        <div class="grid grid-cols-2 gap-2 mb-2">
          <input id="new-user-name"  class="form-input text-xs" placeholder="Full name" autocomplete="off" style="margin-top:0" />
          <input id="new-user-email" class="form-input text-xs" placeholder="Email" autocomplete="off" style="margin-top:0" />
          <input id="new-user-pw"    class="form-input text-xs" type="password" placeholder="Password (min 6)" autocomplete="new-password" style="margin-top:0" />
          <select id="new-user-role" class="form-input text-xs cursor-pointer" style="margin-top:0">
            <option value="STAFF">Staff</option>
            <option value="PRODUCER">Producer</option>
            <option value="PM">Project Manager</option>
            <option value="TEAM_LEAD">Team Lead</option>
            <option value="SALES">Sales</option>
            <option value="FINANCE">Finance</option>
            <option value="ADMIN">Admin</option>
          </select>
        </div>
        <button type="button" onclick="addUser()"
          class="w-full bg-accent text-bg text-xs font-semibold py-2 rounded-lg
                 hover:brightness-110 transition-all cursor-pointer mt-1">
          Add user
        </button>
        </form>
        <div id="user-mgr-msg" class="text-xs mt-2 min-h-[16px]"></div>
      </div>
    </div>
  </div>

  <script src="/js/person-profile.js"></script>
  <script src="/js/mywork.js"></script>
  <script>
    initUserUI();
    window._reloadCurrentTab = loadMyWork; // so the company filter buttons reload this page's data
    loadMyWork();
  </script>
</body>
</html>
